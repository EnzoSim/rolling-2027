name: Check institutes' poll reports

# Les rapports d'intentions de vote que les instituts déposent sur leur site, avant que la
# Commission des sondages mette leur notice en ligne (check_institute_reports.py). Le rythme
# vient du serveur de Ballottage, qui appelle workflow_dispatch toutes les 20 minutes
# (server/poll-watch.js de EnzoSim/second-tour) : GitHub ne tient pas un cron serré.
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: check-institute-reports
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Look for new reports and open issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: "1"
        run: python check_institute_reports.py --create-issues

      - name: Commit seen reports
        if: always()
        run: |
          if [ -f .institute_reports.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .institute_reports.json
            git diff --quiet --cached || git commit -m "🤖 Rapports d'instituts vus [skip ci]"
            git push || echo "No changes to push"
          fi
