name: Sync Mieux Voter

# rolling-2027 : reprend de MieuxVoter/presidentielle2027 les sondages que nous n'avons pas
# (scripts/import_upstream.py), garde les nôtres, puis régénère les fichiers consolidés.
# Toutes les six heures. Pas de `git merge` : les deux dépôts dépouillent les mêmes notices
# et ne les rangent pas pareil.
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reprendre les sondages absents
        id: import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --quiet --depth 1 https://github.com/MieuxVoter/presidentielle2027.git "$RUNNER_TEMP/amont"
          python scripts/import_upstream.py "$RUNNER_TEMP/amont"

      - name: Installer les dépendances de vérification
        if: steps.import.outputs.changed == 'true'
        run: python -m pip install -r requirements_pytests.txt

      - name: Régénérer et pousser
        if: steps.import.outputs.changed == 'true'
        run: |
          python compute_confidence_intervals.py
          python merge.py
          python csv_to_json.py
          python update_badge.py
          python update_top_hypotheses.py
          # Un import peut réussir tout en dupliquant des poll_id ou en associant un
          # résultat à la mauvaise hypothèse : jamais les publier.
          python -m pytest -q
          git add -A polls polls.csv hypotheses.csv candidats.csv presidentielle2027.csv presidentielle2027.json README.md
          git commit -m "🔄 Reprise de MieuxVoter/presidentielle2027 [skip ci]"
          git push

      - name: Mettre à jour l’alerte de synchronisation
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_STATUS: ${{ job.status }}
        run: python scripts/sync_issue.py "$SYNC_STATUS"
