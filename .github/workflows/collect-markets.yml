name: Daily prediction markets

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-markets
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read Ballottage's market collector
        uses: actions/checkout@v4
        with:
          repository: EnzoSim/second-tour
          path: .market-collector
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/collect-markets.mjs
            /server/
            /src/
            /package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect actual quotes and daily histories from both providers
        run: node .market-collector/scripts/collect-markets.mjs data/markets.json
      - name: Publish the dated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json
          git diff --cached --quiet && exit 0
          git commit -m "Collecte quotidienne Polymarket et Kalshi [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
