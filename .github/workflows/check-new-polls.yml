name: Check for New Presidential Polls

on:
  schedule:
    # rolling-2027 : toutes les heures (Mieux Voter : une fois par jour, à 9 h UTC).
    - cron: '17 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check-polls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Check for new polls and create issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_new_polls.py --create-issues

      - name: Commit counter update
        if: always()
        run: |
          if [ -f .last_poll_count ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .last_poll_count
            git diff --quiet --cached || git commit -m "🤖 Update poll counter [skip ci]"
            git push || echo "No changes to push"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Poll Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workflow completed. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
